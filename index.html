<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Seli — SEC Insider Trading Intelligence</title>
    <meta name="description" content="Track SEC Form 4 insider trading signals in real time. Conviction scoring, sector heatmaps, congressional trades, and portfolio integration. Built for serious retail investors." />
    <meta name="keywords" content="insider trading, SEC Form 4, insider trading tracker, stock signals, congressional trading, STOCK Act, insider buying, C-suite trades, conviction scoring, retail investing" />
    <meta name="author" content="Seli" />
    <link rel="canonical" href="https://seli.app" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://seli.app" />
    <meta property="og:title" content="Seli — SEC Insider Trading Intelligence" />
    <meta property="og:description" content="Real-time SEC Form 4 signals scored by conviction. See what C-suite executives are buying before the market moves." />
    <meta property="og:image" content="https://seli.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Seli" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://seli.app" />
    <meta name="twitter:title" content="Seli — SEC Insider Trading Intelligence" />
    <meta name="twitter:description" content="Real-time SEC Form 4 signals scored by conviction. See what C-suite executives are buying before the market moves." />
    <meta name="twitter:image" content="https://seli.app/og-image.png" />

    <!-- Structured data — helps Google understand the product -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Seli",
      "url": "https://seli.app",
      "description": "Real-time SEC Form 4 insider trading signals with conviction scoring, sector heatmaps, congressional trade tracking, and portfolio integration.",
      "applicationCategory": "FinanceApplication",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "11.99",
          "priceCurrency": "USD",
          "billingIncrement": "P1M"
        }
      ],
      "operatingSystem": "Web"
    }
    </script>

    <!-- Favicon — png, not svg: the logo asset used elsewhere in this app
         (src/assets/logo-simple.png) is already a PNG, so this avoids
         needing a separate vector export. Multiple sizes/rels so it looks
         right in a browser tab, on an iOS home-screen save, and in
         bookmarks — a single generic favicon often looks soft/blurry on
         high-density displays or gets cropped oddly on iOS without these. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
