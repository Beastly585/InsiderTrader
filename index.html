    <!-- Favicon — png, not svg: the logo asset used elsewhere in this app
         (src/assets/logo-simple.png) is already a PNG, so this avoids
         needing a separate vector export. Multiple sizes/rels so it looks
         right in a browser tab, on an iOS home-screen save, and in
         bookmarks — a single generic favicon often looks soft/blurry on
         high-density displays or gets cropped oddly on iOS without these. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <div id="root"></div>
    <noscript>
      <div style="max-width:800px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;color:#e8e8ec;">
        <h1>Seli: insider trading and Congress stock trades, tracked for you</h1>
        <p>Company executives, directors, large shareholders and members of Congress have to disclose
        when they buy or sell stock. Seli reads every SEC Form 4 filing and STOCK Act disclosure as it's
        published, explains each one in plain English, and emails you when someone trades a stock you
        own or follow.</p>
        <h2>Insider buying this week</h2>
        <p>The biggest open-market purchases by CEOs, CFOs and directors, updated through the day.
        <a href="https://seli.app/insider-buying">See this week's insider buying</a>.</p>
        <h2>Congress stock trades</h2>
        <p>Every stock trade disclosed by members of the House and Senate, who made it, and which stocks
        Congress is trading most. <a href="https://seli.app/congress">See the latest Congress trades</a>.</p>
        <h2>A page for every stock and insider</h2>
        <p>Look up any ticker to see who has been buying and selling it, or any executive or member of
        Congress to see every trade they've filed and how their buys have done since.
        For example: <a href="https://seli.app/stock/NVDA">NVIDIA (NVDA)</a>,
        <a href="https://seli.app/stock/AAPL">Apple (AAPL)</a>, <a href="https://seli.app/stock/TSLA">Tesla (TSLA)</a>.</p>
        <h2>Free to start</h2>
        <p>Free accounts get every stock and insider page with 12 months of trades and a weekly email on
        3 stocks or people. Pro adds full history, same-day alerts, daily digests and brokerage linking.
        The full dataset is also available as a <a href="https://seli.app/data-download">CSV download</a>.</p>
        <p><a href="https://seli.app">Sign up free at seli.app</a>. No credit card required.</p>
      </div>
