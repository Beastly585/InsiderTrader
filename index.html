        <h1>Seli — See What Insiders Are Buying Before the Market Reacts</h1>
        <p>CEOs, directors, and members of Congress are legally required to disclose their stock
        trades. These insider trades outperform the market by 4–5% annually. Seli watches every
        SEC Form 4 filing and STOCK Act disclosure within minutes of publication, scores
        each trade by conviction, and alerts you to the ones that matter.</p>
        <h2>Insider Trading Signals</h2>
        <p>Every trade gets a conviction score based on peer-reviewed research — who traded, whether
        multiple insiders are buying the same stock, how much of their holdings the trade represents,
        and the dollar value. Higher conviction = more markers of a historically meaningful insider trade.</p>
        <h2>Congressional Stock Trading Tracker</h2>
        <p>Track what senators and representatives are buying and selling. STOCK Act disclosures from
        every member of Congress, searchable and scored alongside corporate insider trades.</p>
        <h2>Portfolio Integration &amp; Insider Alerts</h2>
        <p>Connect your brokerage account and see insider buying and selling on stocks in your portfolio.
        Get instant alerts when executives trade something you hold.</p>
        <h2>SEC Form 4 Data — Every Filing Since 2010</h2>
