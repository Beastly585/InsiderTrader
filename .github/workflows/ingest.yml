name: Daily Form 4 Ingestion

on:
  schedule:
    - cron: '0 4 * * 1-5'   # 11 PM ET weekdays
  workflow_dispatch:          # manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests psycopg2-binary python-dotenv \
                      beautifulsoup4 pdfplumber lxml psycopg

      - name: Fetch latest filings (last 3 days)
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          USER_AGENT_EMAIL: ${{ secrets.USER_AGENT_EMAIL }}
        run: cd db && python fetch_filings_neon.py

      - name: Enrich prices (yesterday's close)
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: cd db && python enrich_prices.py

      - name: Fetch congressional trades (last 7 days)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd db && python fetch_political_trades.py --house --days 7
