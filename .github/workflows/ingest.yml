name: Ingest Form 4 Filings

on:
  schedule:
    # ── TIER A: Market-hours polling ──────────────────────────────────────
    - cron: '30,45 13 * * 1-5'
    - cron: '0,15,30,45 14-19 * * 1-5'
    - cron: '0 20 * * 1-5'

    # ── TIER B: Pre-market ────────────────────────────────────────────────
    - cron: '0 12 * * 1-5'

    # ── TIER C: Post-market ───────────────────────────────────────────────
    - cron: '0 21 * * 1-5'

    # ── TIER D: Daily wide safety net ─────────────────────────────────────
    - cron: '0 8 * * *'

  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to look back (default: 3)'
        required: false
        default: '3'
      dry_run:
        description: 'Dry run only — parse but do not write to DB'
        required: false
        default: 'false'
      test_tweets:
        description: 'Preview tweet candidates without posting'
        required: false
        default: 'false'

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.schedule == '0 8 * * *' && 25 || 15 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "psycopg[binary]" requests python-dotenv lxml

      - name: Determine DAYS_BACK for this run
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.days_back }}" ]; then
            echo "days_back=${{ github.event.inputs.days_back }}" >> "$GITHUB_OUTPUT"
            echo "update_prices=true" >> "$GITHUB_OUTPUT"
          else
            HOUR_UTC=$(date -u +%H)
            MIN_UTC=$(date -u +%M)
            DOW=$(date -u +%u)

            if [ "$HOUR_UTC" = "08" ]; then
              echo "days_back=4" >> "$GITHUB_OUTPUT"
              echo "update_prices=true" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR_UTC" = "12" ]; then
              echo "days_back=2" >> "$GITHUB_OUTPUT"
              echo "update_prices=true" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR_UTC" = "21" ]; then
              echo "days_back=1" >> "$GITHUB_OUTPUT"
              echo "update_prices=true" >> "$GITHUB_OUTPUT"
            else
              echo "days_back=1" >> "$GITHUB_OUTPUT"
              echo "update_prices=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run Form 4 ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT_EMAIL: ${{ secrets.USER_AGENT_EMAIL }}
          DAYS_BACK: ${{ steps.vars.outputs.days_back }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_WORKERS: '2'
        run: |
          cd db
          python fetch_filings_neon.py

      - name: Send instant alerts
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
          NEON_PROXY_URL: ${{ secrets.NEON_PROXY_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          cd db
          python send_instant_alerts.py

      - name: Post top signals to Twitter
        # Runs on Tier B/C/D (update_prices=true) — up to 2 tweets per day.
        # tweet_log table prevents double-posting across runs.
        # TEST_PREVIEW mode shows candidates without posting (manual dispatch).
        if: success() && steps.vars.outputs.update_prices == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          MAX_TWEETS: '2'
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TEST_PREVIEW: ${{ github.event.inputs.test_tweets || 'false' }}
        run: |
          cd db
          if [ -f post_signal_tweet.py ]; then
            python post_signal_tweet.py
          else
            echo "post_signal_tweet.py not found, skipping"
          fi

      - name: Update price history
        if: success() && steps.vars.outputs.update_prices == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          cd db
          if [ -f update_recent_prices.py ]; then
            python update_recent_prices.py
          else
            echo "update_recent_prices.py not found, skipping"
          fi