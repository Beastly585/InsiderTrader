# .github/workflows/emails.yml
# Welcome email, Pro daily digest, weekly digest. The only workflow that sends
# digests (digests.yml was an older duplicate and is gone).
#
# How runs start: the Cloudflare Worker starts each job on time through
# workflow_dispatch (see dispatchScheduled() in worker/neon-proxy.js).
# GitHub's own scheduler delayed or dropped on-the-hour runs.
#   daily    12:30 UTC weekdays   Pro daily digest (after the 12:00 pre-market ingest)
#   welcome  13:00 UTC every day  welcome email for new sign-ups
#   weekly   22:00 UTC Sunday     weekly digest for everyone
#
# Backup: one GitHub schedule a day. If the Worker hasn't started an email run
# in the last 26 hours, it runs whatever is due. Every script has its own
# "already sent" guard, so a backup that overlaps a Worker run sends nothing
# twice (welcome: welcome_sent_at; daily: 18h; weekly: 5 days).
name: emails

on:
  schedule:
    - cron: '41 15 * * *'   # backup
  workflow_dispatch:
    inputs:
      job:
        description: "welcome | daily | weekly (set by the Worker; blank = whatever is due)"
        required: false
        default: ""
      only_email:
        description: "Send only to this address (testing)"
        required: false
      dry_run:
        description: "true = build but don't send"
        required: false
        default: "false"

concurrency:
  group: emails
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # the backup check reads this workflow's recent runs

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: db
    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
      EMAIL_LINK_SECRET:  ${{ secrets.EMAIL_LINK_SECRET }}
      WORKER_API_KEY:     ${{ secrets.WORKER_API_KEY }}
      NEON_PROXY_URL:     https://neon-proxy.beastly-insider-trades.workers.dev
      APP_URL:            https://seli.app
      ALERTS_FROM_EMAIL:  alerts@mail.seli.app
      WELCOME_REPLY_TO:   ${{ secrets.WELCOME_REPLY_TO }}
      MAILING_ADDRESS:    ${{ secrets.MAILING_ADDRESS }}
      ONLY_EMAIL:         ${{ github.event.inputs.only_email }}
      DRY_RUN:            ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
    steps:
      - name: Pick jobs
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ github.event.inputs.job }}
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/emails.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].created_at // empty')
            if [ -n "$LAST" ] && [ $(( $(date -u +%s) - $(date -u -d "$LAST" +%s) )) -lt 93600 ]; then
              echo "Worker started an email run at $LAST; backup not needed."
              echo "jobs=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            JOB=""
          fi
          if [ -z "$JOB" ]; then
            # Whatever is due today. The scripts skip anyone already sent.
            DOW=$(date -u +%u)                      # 1=Mon ... 7=Sun
            JOB="welcome"
            [ "$DOW" -le 5 ] && JOB="$JOB daily"
            [ "$DOW" = 7 ] || [ "$DOW" = 1 ] && JOB="$JOB weekly"   # Monday catches a missed Sunday
          fi
          echo "Jobs: $JOB"
          echo "jobs=$JOB" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pick.outputs.jobs != ''
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.jobs != ''
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install "psycopg[binary]" requests python-dotenv
        if: steps.pick.outputs.jobs != ''

      - name: Welcome email
        if: contains(steps.pick.outputs.jobs, 'welcome')
        run: python send_welcome.py
      - name: Pro daily digest
        if: ${{ !cancelled() && contains(steps.pick.outputs.jobs, 'daily') }}
        run: python send_digests.py
        env: { DIGEST_TYPE: daily }
      - name: Weekly digest
        if: ${{ !cancelled() && contains(steps.pick.outputs.jobs, 'weekly') }}
        run: python send_digests.py
        env: { DIGEST_TYPE: weekly }